name: Publish release

# Publica automáticamente al actualizar la rama main (producción).
# Ejecuta publish.ps1: dotnet publish (Release, win-x64, self-contained) →
# vpk pack → vpk upload github.
#
# Requisito manual en GitHub: crear el secret GH_TOKEN (token con permiso
# write:packages). Si el secret no existe, el workflow empaqueta en releases/
# pero omite la subida (publish.ps1 salta el upload sin token).

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Velopack CLI
        shell: pwsh
        run: |
          dotnet tool install -g vpk
          echo "$HOME/.dotnet/tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Publish + pack + upload
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: ./publish.ps1