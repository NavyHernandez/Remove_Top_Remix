name: Publish release

# Publica automáticamente al actualizar la rama main (producción).
# Ejecuta publish.ps1: dotnet publish (Release, win-x64, self-contained) →
# vpk pack → vpk upload github.
#
# VERSIÓN (auto-bump + respeto del csproj):
#   1. Leer <Version> del Remove_Top.csproj (versión "ordenada" por el dev).
#   2. Calcular auto-bump = último tag de GitHub + 1 al patch.
#      El cálculo NORMALIZA el prefijo "v" antes de ordenar (tags sin "v"
#      también cuentan y no redisparan una release existente).
#   3. Publicar max(csproj, auto-bump):
#        - csproj > último tag  → se usa el csproj (salto explícito de
#          minor/major, p. ej. 0.3.9 → 0.4.0; ANTES se ignoraba y salía
#          0.3.10, incidente del 2026-09-24).
#        - en otro caso         → auto-bump patch+1 (flujo normal).
#   Convención: los tags del repo deben ser vX.Y.Z.
#   NUNCA re-etiquetar una release publicada sin re-builderar: los binarios
#   y releases.win.json seguirían anunciando la versión vieja.
#
# Requisito manual en GitHub: crear el secret GH_TOKEN (token con permiso
# contents: write, para crear releases y subir assets). Si el secret no
# existe, el workflow empaqueta en releases/ pero omite la subida.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # necesario para leer los tags y calcular la versión

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Velopack CLI
        shell: pwsh
        run: |
          dotnet tool install -g vpk
          echo "$HOME/.dotnet/tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Resolve version (csproj or auto-bump, whichever is higher)
        id: version
        shell: pwsh
        run: |
          # Asegura que los tags estén disponibles.
          git fetch --tags --force

          # ── 1) Versión ordenada en el csproj ──
          $csproj = "Remove_Top/Remove_Top.csproj"
          $raw = Get-Content $csproj -Raw
          $m = [regex]::Match($raw, '<Version>([^<]+)</Version>')
          $csprojVer = if ($m.Success) { $m.Groups[1].Value.Trim() } else { $null }
          if (-not $csprojVer) { throw "No se pudo leer <Version> del csproj ($csproj)." }

          # ── 2) Auto-bump desde el último tag (prefijo v normalizado) ──
          # `git tag --sort=-v:refname` coloca los tags SIN "v" por debajo de
          # los que sí lo llevan; se quitan las v y se ordena como [version].
          $lastTag = @(git tag) | ForEach-Object { $_ -replace '^[vV]', '' } | Where-Object { $_ -match '^\d+\.\d+(\.\d+)?$' } | Sort-Object { [version]$_ } | Select-Object -Last 1
          if (-not $lastTag) { $lastTag = "0.1.0" }
          $parts = $lastTag.Split('.')
          $major = [int]$parts[0]
          $minor = [int]$parts[1]
          $patch = if ($parts.Length -gt 2) { [int]$parts[2] } else { 0 }
          $patch += 1
          $autoBump = "$major.$minor.$patch"

          # ── 3) max(csproj, auto-bump) ──
          # Si el dev subió el csproj por encima del último tag (salto de
          # minor/major), se respeta el csproj. Si no, manda el auto-bump.
          # Evita el incidente: csproj 0.4.0 + último tag 0.3.9 → publicaba
          # 0.3.10 en vez de 0.4.0.
          $version = if ([version]$csprojVer -gt [version]$lastTag) { $csprojVer } else { $autoBump }

          echo "VERSION=$version" >> $env:GITHUB_ENV
          echo "csproj=$csprojVer | último tag=$lastTag | auto-bump=$autoBump -> publica $version"

      - name: Publish + pack + upload
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: ./publish.ps1 -Version $env:VERSION